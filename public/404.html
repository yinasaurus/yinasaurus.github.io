<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extinct — Yin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f5f2ec;
        --ink: #171225;
        --punch: #ff4d8d;
        --sage: #b7c89c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      }
      .wrap {
        max-width: 32rem;
      }
      .micro {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: color-mix(in srgb, var(--ink) 45%, transparent);
      }
      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(2.4rem, 8vw, 4.2rem);
        line-height: 1.02;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.75rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.55;
        color: color-mix(in srgb, var(--ink) 65%, transparent);
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.75rem 1.25rem;
        border: 2px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        text-decoration: none;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        box-shadow: 4px 4px 0 0 var(--punch);
      }
      .egg {
        width: 2.6rem;
        height: 3.4rem;
        border: 2px solid var(--ink);
        border-radius: 50% 50% 48% 48%;
        background: #ead7b0;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="egg" aria-hidden></div>
      <p class="micro">Error 404</p>
      <h1>This page went extinct.</h1>
      <p>The fossil record for this URL is empty. Wander back to camp.</p>
      <a href="/">Back to the clearing</a>
    </div>
  </body>
</html>
